<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご予約内容の確認 | 寿司 博多魚がし</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/confirm.css">
</head>


<body>


    <!-- =========================
     HEADER
========================= -->

    <header class="header">

        <div class="logo">
            <a href="index.html">
                <span>博多魚がし</span> 寿司
            </a>
        </div>

        <nav class="nav">

            <a href="index.html">ホーム</a>

            <a href="index.html#about">私たちについて</a>

            <a href="index.html#menu">メニュー</a>

            <a href="reservation.html" class="nav-reservation">予約する</a>

        </nav>

    </header>



    <main class="confirm-page">


        <!-- =========================
         TITLE
    ========================= -->

        <section class="page-title">

            <span>ご予約確認</span>

            <h1>ご予約内容のご確認</h1>

            <p>
                ご予約内容をご確認ください
            </p>

        </section>



        <div class="confirm-container">


            <!-- =========================
             STEP
        ========================= -->

            <div class="steps">

                <div class="step">

                    <div class="step-number">
                        1
                    </div>

                    日時・人数

                </div>


                <div class="step-line"></div>


                <div class="step">

                    <div class="step-number">
                        2
                    </div>

                    メニュー

                </div>


                <div class="step-line"></div>


                <div class="step active">

                    <div class="step-number">
                        3
                    </div>

                    確認

                </div>


                <div class="step-line"></div>


                <div class="step">

                    <div class="step-number">
                        4
                    </div>

                    完了

                </div>

            </div>



            <!-- =========================
             RESERVATION INFORMATION
        ========================= -->

            <section class="confirm-box">

                <div class="confirm-title">
                    ご予約情報
                </div>


                <div class="reservation-info">


                    <div class="info-row">

                        <span class="info-label">
                            ご来店日
                        </span>

                        <span class="info-value" id="confirm-date">
                            ---
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            ご来店時間
                        </span>

                        <span class="info-value" id="confirm-time">
                            ---
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            ご利用人数
                        </span>

                        <span class="info-value" id="confirm-guests">
                            ---
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            テーブル
                        </span>

                        <span class="info-value" id="confirm-table">
                            ---
                        </span>

                    </div>

                </div>

            </section>



            <!-- =========================
             MENU INFORMATION
        ========================= -->

            <section class="confirm-box">

                <div class="confirm-title">
                    ご注文メニュー
                </div>


                <table class="menu-table">

                    <thead>

                        <tr>

                            <th>
                                メニュー
                            </th>

                            <th class="price">
                                価格
                            </th>

                            <th class="quantity">
                                数量
                            </th>

                            <th class="subtotal">
                                小計
                            </th>

                        </tr>

                    </thead>


                    <tbody id="menu-list">

                        <!-- JavaScriptで表示 -->

                    </tbody>

                </table>


                <!-- Total -->

                <div class="total-area">

                    <span>
                        合計
                    </span>

                    <strong>
                        ¥<span id="confirm-total">
                            0
                        </span>
                    </strong>

                </div>

            </section>



            <!-- =========================
             NOTICE
        ========================= -->

            <div class="notice">

                <div class="notice-title">
                    ご予約について
                </div>

                <div>
                    ・予約内容をご確認のうえ「予約を確定する」ボタンを押してください。
                </div>

                <div>
                    ・予約確定後、QRコードが発行されます。
                </div>

                <div>
                    ・ご来店時にQRコードをスタッフへ提示してください。
                </div>

                <div>
                    ・予約内容を変更する場合は、前の画面に戻ってください。
                </div>

            </div>



            <!-- =========================
             BUTTON
        ========================= -->

            <div class="button-area">

                <button class="back-button" onclick="goBack()">
                    ← メニュー選択に戻る
                </button>


                <button class="confirm-button" onclick="confirmReservation()">
                    予約を確定する
                </button>

            </div>


        </div>

    </main>



    <!-- =========================
     JAVASCRIPT
========================= -->

    <script>


        /*
         * =========================================
         * 1. GET RESERVATION DATA
         * =========================================
         */

        const reservationData =
            JSON.parse(
                localStorage.getItem("reservationData")
            );


        /*
         * =========================================
         * 2. CHECK DATA
         * =========================================
         */

        if (!reservationData) {

            alert(
                "予約情報がありません。"
            );

            window.location.href =
                "reservation.html";
        }


        /*
         * =========================================
         * 3. DISPLAY RESERVATION INFORMATION
         * =========================================
         */

        if (reservationData) {


            document.getElementById(
                "confirm-date"
            ).textContent =
                reservationData.date;


            document.getElementById(
                "confirm-time"
            ).textContent =
                reservationData.time;


            document.getElementById(
                "confirm-guests"
            ).textContent =
                reservationData.guests + " 名";


            document.getElementById(
                "confirm-table"
            ).textContent =
                "テーブル " + reservationData.table;

        }


        /*
         * =========================================
         * 4. DISPLAY MENU
         * =========================================
         */

        function displayMenus() {


            const menuList =
                document.getElementById(
                    "menu-list"
                );


            /*
             * menu data が存在しない場合
             */

            if (
                !reservationData ||
                !reservationData.menus ||
                reservationData.menus.length === 0
            ) {

                menuList.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty-menu"
                >
                    メニューは選択されていません。
                </td>
            </tr>
        `;

                document.getElementById(
                    "confirm-total"
                ).textContent = "0";

                return;
            }


            /*
             * メニューを表示
             */

            reservationData.menus.forEach(
                function (item) {


                    const subtotal =
                        item.price * item.quantity;


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                <td>
                    ${item.name}
                    ${(item.options && item.options.length) ? '<div class="option-tags">' + item.options.map(function (o) { return '<span class="option-tag">' + o + '</span>'; }).join('') + '</div>' : ''}
                </td>

                <td class="price">
                    ¥${item.price.toLocaleString("ja-JP")}
                </td>

                <td class="quantity">
                    ${item.quantity}
                </td>

                <td class="subtotal">
                    ¥${subtotal.toLocaleString("ja-JP")}
                </td>

            `;


                    menuList.appendChild(row);

                }
            );


            /*
             * Total
             */

            document.getElementById(
                "confirm-total"
            ).textContent =
                reservationData.totalPrice
                    .toLocaleString("ja-JP");

        }


        /*
         * =========================================
         * 5. BACK BUTTON
         * =========================================
         */

        function goBack() {

            window.location.href =
                "menu.html";

        }


        /*
         * =========================================
         * 6. CONFIRM RESERVATION
         * =========================================
         */

        function confirmReservation() {


            /*
             * 確認ダイアログ
             */

            const result =
                confirm(
                    "この内容で予約を確定しますか？"
                );


            if (!result) {

                return;

            }


            /*
             * =====================================
             * Generate Reservation ID
             * =====================================
             *
             * Backendがまだないので
             * 一時的にJavaScriptで作成
             */

            const reservationId =
                "UG" +
                Date.now().toString().slice(-8);


            /*
             * reservation ID を保存
             */

            reservationData.reservationId =
                reservationId;


            /*
             * 予約ステータス
             */

            reservationData.status =
                "confirmed";


            /*
             * 予約確定日時
             */

            reservationData.createdAt =
                new Date().toISOString();


            /*
             * localStorageへ保存
             */

            localStorage.setItem(
                "reservationData",
                JSON.stringify(
                    reservationData
                )
            );


            /*
             * complete.htmlへ
             */

            window.location.href =
                "complete.html";

        }


        /*
         * =========================================
         * 7. DISPLAY DATA
         * =========================================
         */

        displayMenus();

    </script>


</body>

</html>
